name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:electron-win
            files: |
              dist/*.exe
              dist/*.blockmap
          - os: macos-latest
            script: build:electron-mac
            files: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-latest
            script: build:electron-linux
            files: |
              dist/*.AppImage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: npm test

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: quence-infra-${{ matrix.os }}
          path: ${{ matrix.files }}
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
